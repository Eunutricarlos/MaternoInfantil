<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Materno-Infantil | Plataforma de Estudos em Nutrição</title>
<meta name="description" content="Plataforma de estudos de Nutrição Materno-Infantil: gestação, avaliação nutricional, lactação, aleitamento, banco de leite e lactário. Resumos, flashcards e quiz.">
<meta name="theme-color" content="#0e6b6f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (edite as cores aqui) ===== */
:root{--bg:#f4f7f8;--card:#fff;--ink:#12272e;--mut:#5a6f76;--pri:#0e6b6f;--acc:#a23b72;--line:#dbe5e7;--soft:#e4f1f1;--warn:#fbeaf2;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1e;--card:#15262b;--ink:#e6f0f1;--mut:#9bb0b5;--pri:#4fc1c4;--acc:#e58ab9;--line:#25393f;--soft:#1a3238;--warn:#2e2030}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0 0 .5em}
a{color:var(--pri)}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:99}
/* ===== Layout ===== */
header{position:fixed;inset:0 0 auto 0;height:60px;display:flex;gap:10px;align-items:center;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line);z-index:20}
.brand{font:700 1.1rem Fraunces,serif;color:var(--pri);text-decoration:none;white-space:nowrap}
#menuBtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:42px;height:42px;font-size:20px}
#q{flex:1;min-width:0;max-width:460px;margin-left:auto;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
aside{position:fixed;top:60px;bottom:0;left:0;width:300px;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:16px;z-index:15;transition:transform .25s}
aside h3{font:600 .8rem Inter;color:var(--mut);margin:18px 0 6px}
aside a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.93rem}
aside a:hover{background:var(--soft)}aside a.on{background:var(--pri);color:#fff}
aside a.ok::after{content:" ✓";color:var(--acc)}aside a.on.ok::after{color:#fff}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
main{margin:60px 0 0 300px;padding:28px clamp(16px,4vw,48px) 90px;max-width:1000px;outline:0}
#ov{display:none;position:fixed;inset:60px 0 0 0;background:#0007;z-index:14}
@media(max-width:860px){aside{transform:translateX(-105%);width:min(310px,86vw)}body.open aside{transform:none}body.open #ov{display:block}main{margin-left:0}}
@media(min-width:861px){#menuBtn{display:none}}
/* ===== Componentes ===== */
.crumb{color:var(--acc);font-weight:600;font-size:.9rem;margin:0}
.call{border-radius:var(--r);padding:14px 18px;margin:14px 0;border:1px solid var(--line)}.call p{margin:.2em 0 0}
.sum{background:var(--soft)}.exam{background:var(--warn);border-color:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.btn,.tools button,.pn a{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;text-decoration:none;display:inline-block}
.btn.pri,.tools .pri{background:var(--pri);color:#fff;border-color:var(--pri)}html .btn.pri{color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0}
summary{padding:14px 18px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--acc);font-size:1.3rem;line-height:1}details[open] summary::after{content:"−"}
.bd{padding:0 18px 16px}.bd ul{padding-left:20px;margin:.4em 0}.bd li{margin:.3em 0}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:480px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--soft)}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px 0 24px}
.tc{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s}
.tc:hover{border-color:var(--pri);transform:translateY(-2px)}.tc b{display:block}.tc span{font-size:.86rem;color:var(--mut)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.stats div{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}.stats b{font:700 1.6rem Fraunces,serif;color:var(--pri);display:block}
.tl{display:flex;border-radius:12px;overflow:hidden;margin:18px 0 6px;font-size:.85rem;color:#fff;text-align:center}
.tl div{padding:12px 4px}.tl .a{flex:13;background:#3d8f93}.tl .b{flex:14;background:#0e6b6f}.tl .c{flex:13;background:#0a4f52}.tl .d{flex:12;background:#a23b72}
.fc{min-height:230px;display:grid;place-items:center;text-align:center;padding:28px;background:var(--card);border:2px solid var(--pri);border-radius:18px;font-size:1.15rem;cursor:pointer;margin:14px 0}
.fc.back{background:var(--soft);border-color:var(--acc)}.fc small{display:block;color:var(--mut);font-size:.8rem;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.op:hover:not(:disabled){border-color:var(--pri)}.op.ok{background:#d9f2e3;border-color:#2e9e5b;color:#0d3b20}.op.no{background:#fbdcdc;border-color:#c0392b;color:#5a1310}
.ex{background:var(--soft);border-radius:12px;padding:12px 16px;margin:10px 0}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:8px 0}
#top{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:20px;display:none;z-index:10}
mark{background:#ffe08a;color:#000;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ==========================================================
   DADOS — para editar o conteúdo, altere os arrays T, F e Q.
   T = assuntos | F = flashcards [pergunta, resposta] | Q = quiz
   ========================================================== */
const T=[
{id:"trimestres",g:"Gestação",t:"Trimestres e crescimento fetal",
s:"A gestação tem 40 semanas e 3 trimestres. O feto passa da multiplicação de células (hiperplasia) para o aumento do tamanho delas (hipertrofia).",
p:"Peso fetal médio (slides): 12ª sem = 300 g, 27ª = 1000 g, 38ª = 3000 g. O marco de 28 semanas é ponto crítico. Folato até o fim do 1º trimestre (tubo neural).",
sec:[
["Crescimento por trimestre",`<div class=tw><table><tr><th>Trimestre<th>Crescimento<th>Velocidade<th>Peso médio</tr><tr><td>1º<td>Hiperplasia<td>Lenta<td>12ª sem: 300 g</tr><tr><td>2º<td>Hiperplasia + hipertrofia<td>Acelerada<td>27ª sem: 1000 g</tr><tr><td>3º<td>Hipertrofia<td>Máxima<td>38ª sem: 3000 g</tr></table></div><p><b>Por que importa:</b> uma agressão nutricional na fase de hiperplasia reduz o número de células (efeito mais duradouro); na hipertrofia, reduz o tamanho delas (mais recuperável).</p>`],
["1º trimestre",`<ul><li>Intensa divisão celular: a saúde do embrião depende do estado nutricional pré-gestacional (reservas de energia, vitaminas e minerais).</li><li>Formação do tubo neural: administrar folato até o fim do 1º trimestre.</li><li>Peso esperado: perda de até 3 kg (enjoos e vômitos) ou ganho de até 2 kg.</li></ul>`],
["2º e 3º trimestres",`<ul><li>O meio externo passa a influenciar direto o feto: ganho de peso adequado, ingestão de energia e nutrientes, estilo de vida e fator emocional.</li><li>Marco de 28 semanas: consequências imediatas e futuras para mãe e feto.</li><li>Adipócitos fetais surgem a partir do 4º mês; no último trimestre, o ganho de peso materno estimula a massa muscular fetal.</li></ul>`],
["Fatores de risco gestacional",`<ul><li><b>Inalteráveis:</b> idade &lt;15 ou &gt;35 anos, doenças crônicas, altura &lt;1,45 m, paridade.</li><li><b>Estilo de vida:</b> tabagismo, álcool, drogas, IMC extremo, inatividade, má alimentação.</li><li><b>Sociais:</b> violência, isolamento, habitação vulnerável, baixa escolaridade.</li><li>É o momento crítico para educação nutricional.</li></ul>`]]},
{id:"placenta",g:"Gestação",t:"Placenta e hormônios",
s:"A placenta transporta nutrientes e O2, elimina resíduos fetais e produz os hormônios que sustentam a gestação.",
p:"Placenta: 51 g (10–12 sem) até 500 g no final. Progesterona = relaxa musculatura lisa (constipação). Lactogênio placentário = antagoniza insulina (risco de DMG).",
sec:[
["Funções da placenta",`<ul><li><b>Transporte:</b> oxigênio e nutrientes da mãe para o feto.</li><li><b>Eliminação:</b> produtos do metabolismo fetal.</li><li><b>Síntese:</b> hormônios do crescimento e desenvolvimento fetal.</li></ul>`],
["Hormônios placentários",`<div class=tw><table><tr><th>Hormônio<th>Ação<th>Consequência clínica</tr><tr><td>HCG<td>Inibe contração uterina, estimula relaxina até a placenta produzir progesterona<td>Detectado no sangue (8 dias) e na urina (15 dias)</tr><tr><td>Tireoidianos<td>Regulam metabolismo; o feto depende 100% da mãe nos primeiros meses<td>Atenção ao iodo</tr><tr><td>Progesterona<td>Relaxa músculo liso do útero e do intestino; mamogênese<td>Mais absorção, porém constipação</tr><tr><td>Estrogênio<td>Elasticidade uterina; reduz proteínas séricas; afeta tireoide<td>Albumina sérica menor</tr><tr><td>Lactogênio placentário<td>Antagoniza a insulina: mais glicose no sangue, proteína depositada no tecido<td>Poupa glicose para o feto</tr><tr><td>Insulina<td>Resposta normal no início; resistência no final (ação reduzida em 50–60%)<td>Base do diabetes gestacional</tr></table></div>`]]},
{id:"adaptacoes",g:"Gestação",t:"Adaptações maternas",
s:"Mudanças fisiológicas garantem gestação, parto e lactação, mas aumentam a vulnerabilidade nutricional.",
p:"Hemodiluição: plasma +50% e massa de Hb +20% = queda de 20% na concentração de Hb e 15% no Ht, com VCM e HCM inalterados. Ureia e creatinina caem.",
sec:[
["Sangue e coração",`<ul><li>Volume plasmático +50%; massa de hemoglobina +20%; débito cardíaco +30–50% (mantido até o fim).</li><li><b>Por que acontece:</b> o plasma cresce mais que as hemácias (ação de estrogênio e progesterona).</li><li><b>Laboratório:</b> a “anemia fisiológica” tem VCM/HCM normais; anemia ferropriva mostra microcitose e ferritina baixa.</li></ul>`],
["Metabolismo",`<ul><li>Metabolismo basal aumenta 15–20%.</li><li>No último trimestre, 50–70% das kcal diárias vão ao feto como glicose; 20% da energia vem de aminoácidos; o restante, de lipídios.</li></ul>`],
["Respiratório e renal",`<ul><li>Hiperventilação (progesterona e estrogênio) para suprir 20% a mais de O2; no final, o útero restringe o diafragma (respiração curta, “ofegante”).</li><li>Fluxo plasmático renal até +70% e filtração glomerular +50%: ureia e creatinina séricas diminuem (valores “normais” de não gestante indicam risco).</li></ul>`],
["Trato gastrointestinal",`<ul><li><b>Sensorial:</b> olfato aumentado no 1º trimestre, principal causa de náuseas e vômitos.</li><li><b>Gástrico:</b> menor tônus, menos HCl, esvaziamento lento (refluxo).</li><li><b>Intestinal:</b> cólon lento: mais absorção, porém constipação.</li></ul>`]]},
{id:"avaliacao",g:"Avaliação nutricional",t:"Idade gestacional e ganho de peso",
s:"O diagnóstico integra 4 pilares: clínico, antropométrico, dietético e bioquímico. O ganho de peso é avaliado pelo IMC pré-gestacional.",
p:"IG = dias desde a DUM ÷ 7. Use o peso ANTES de engravidar. Na gestação, não se deve perder peso (sobrepeso e obesidade incluídos).",
sec:[
["Calcular a idade gestacional",`<ul><li>IG (semanas) = dias entre a DUM e a consulta ÷ 7.</li><li>Exemplo real: DUM 14/03 e consulta 29/05 = 76 dias = 10 semanas e 6 dias. <i>O slide da aula mostra 105 dias e 15 semanas; confirme com a professora qual valor usar.</i></li><li>DUM incerta: início do mês = dia 5; meio = dia 15; final = dia 25.</li></ul>`],
["Fluxo de monitoramento do peso",`<ul><li>1. Calcular IMC pré-gestacional (peso ÷ altura²).</li><li>2. Classificar: baixo peso &lt;18,5; eutrofia 18,5–24,9; sobrepeso 25–29,9; obesidade ≥30.</li><li>3. Pesar com roupa mínima e descalça.</li><li>4. Ganho = peso atual − peso pré-gestacional.</li><li>5. Marcar no gráfico da categoria (Caderneta da Gestante, Kac et al., 2021).</li></ul>`],
["Ganho de peso cumulativo (kg)",`<div class=tw><table><tr><th>IMC pré<th>Até 13 sem<th>Até 27 sem<th>Até 40 sem</tr><tr><td>Baixo peso<td>0,2 a 1,2<td>5,6 a 7,2<td>9,7 a 12,2</tr><tr><td>Eutrofia<td>−1,8 a 0,7<td>3,1 a 6,3<td>8,0 a 12,0</tr><tr><td>Sobrepeso<td>−1,6 a −0,05<td>2,3 a 3,7<td>7,0 a 9,0</tr><tr><td>Obesidade<td>−1,6 a −0,05<td>1,1 a 2,7<td>5,0 a 7,2</tr></table></div>`],
["Conduta por diagnóstico",`<div class=tw><table><tr><th>Diagnóstico<th>Investigar<th>Conduta</tr><tr><td>Baixo peso<td>História alimentar, hiperêmese, infecções, parasitoses, anemias<td>Orientar para ganho adequado</tr><tr><td>Eutrofia<td>Calendário habitual<td>Manter hábitos saudáveis</tr><tr><td>Sobrepeso/obesidade<td>Edema, polidrâmnio, macrossomia, gestação múltipla, diabetes, pré-eclâmpsia<td>Hábitos saudáveis; nunca perder peso</tr></table></div>`],
["Para onde vão os 12 kg",`<p>Bebê 3 kg; tecido adiposo 2; sangue 1,7; útero 1,5; placenta 1; líquido amniótico 1; líquido extracelular 1; mamas 0,8.</p>`]]},
{id:"energia",g:"Avaliação nutricional",t:"Necessidade energética e macronutrientes",
s:"Energia = gasto pré-gestacional + adicional gestacional. O cálculo usa peso, altura e atividade física de antes da gestação (DRI).",
p:"Regra da RDA: +300 kcal a partir do 2º trimestre. DRI: 1º tri +0; 2º e 3º: EER + (8 kcal × IG) + 180. Água: 3 L/dia. Qualidade supera quantidade.",
sec:[
["Passo a passo",`<ul><li><b>OMS/RDA:</b> GET = TMB × FA; somar +300 kcal ao GET pré-gestacional a partir do 2º trimestre.</li><li><b>DRI:</b> 1º tri = EER pré-gestacional; 2º e 3º = EER + (8 kcal × semanas) + 180.</li><li><b>Diretriz 2023 (2º/3º tri, baixo ativo):</b> EER = 693,35 − (2,04 × idade) + (5,73 × altura em cm) + (10,20 × peso) + (9,16 × semanas) + deposição.</li><li><b>Deposição por IMC:</b> baixo peso +300; normal +200; sobrepeso +150; obesidade −50 kcal/dia.</li></ul>`],
["Exemplo do slide",`<p>Gestante de 28 anos, 24 semanas, 66 kg atuais, 1,65 m, baixo ativa, IMC pré 22,0: EER = 693,35 − 57,12 + 945,45 + 673,20 + 219,84 + 200 = <b>2.674,72 kcal/dia</b>.</p>`],
["Macronutrientes",`<div class=tw><table><tr><th>Nutriente<th>Faixa<th>No exemplo</tr><tr><td>Carboidratos<td>55–75% VET; fibras ≥25 g; açúcar de adição &lt;10%<td>55% = 367,8 g</tr><tr><td>Proteínas<td>10–15% VET; base 0,91 g/kg; adicional OMS +6 g, RDA +10 g<td>1,1 g/kg = 72,6 g (10,9%)</tr><tr><td>Lipídios<td>15–30% VET; evitar saturados e trans<td>Restante = 101,35 g (34,1%)</tr></table></div><p><b>Atenção:</b> 34,1% ultrapassa a faixa de 15–30%; vale discutir isso na prova.</p>`],
["Fracionamento do VET",`<p>Café da manhã 25%; lanche da manhã 5%; almoço 35%; lanche da tarde 5%; jantar 25%; ceia 5%. Regra de três: por exemplo, CHO do almoço = 367,8 × 0,35 = 128,7 g. Proteína armazenada na gestação: 925 g (60% feto/placenta, 40% tecidos maternos).</p>`]]},
{id:"micros",g:"Nutrição na gestação",t:"Micronutrientes essenciais",
s:"A energia aumenta pouco, mas a necessidade de micronutrientes aumenta muito: a preocupação é a qualidade da dieta.",
p:"Folato 600 µg; ferro 27 mg (2º e 3º tri); vitamina A 770 µg (excesso causa defeitos congênitos); cálcio 1000 mg (1300 mg em adolescentes); DHA 200 mg/dia.",
sec:[
["Tabela de recomendações",`<div class=tw><table><tr><th>Nutriente<th>Gestante<th>Não gestante</tr><tr><td>Vitamina A<td>770 µg<td>700 µg</tr><tr><td>Vitamina C<td>85 mg<td>75 mg</tr><tr><td>Folato<td>600 µg ↑<td>400 µg</tr><tr><td>Vitamina D<td>15 µg<td>15 µg</tr><tr><td>Vitamina E<td>15 µg<td>15 µg</tr><tr><td>Cálcio<td>1000 mg<td>1000 mg</tr><tr><td>Ferro<td>27 mg ↑<td>18 mg</tr><tr><td>Iodo<td>220 µg<td>150 µg</tr><tr><td>Magnésio<td>350 mg<td>310 mg</tr></table></div>`],
["Folato e ferro",`<ul><li><b>Folato:</b> metilfolato é a forma ativa; deficiência causa defeitos do tubo neural. 600 µg = 200 da alimentação + 400 sintético. Fontes: levedo de cerveja, fígado, folhosos escuros, leguminosas.</li><li><b>Ferro:</b> expansão da massa eritrocitária, crescimento fetal/placentário. RDA 27 mg (máx. 45 mg); a OMS indica suplementação. Fontes: fígado, carnes, folhosos, feijões.</li></ul>`],
["Vitamina D, cálcio e vitamina A",`<ul><li><b>Vit. D (deficiência):</b> hipocalcemia neonatal, hipoplasia do esmalte, osteomalácia materna.</li><li><b>Cálcio (deficiência):</b> prejuízo ao crescimento fetal, alterações de pressão, contrações e parto prematuro.</li><li><b>Vit. A:</b> desenvolvimento fetal, imunidade, placenta. Retinol (fígado, leite integral, queijos) e carotenoides (folhosos, cenoura, manga, mamão).</li></ul>`],
["Ácidos graxos",`<ul><li><b>EPA:</b> anti-inflamatório, evita trombos, protege o coração.</li><li><b>DHA:</b> SNC fetal e retina; suplementar 200 mg/dia em gestantes e lactantes no Brasil (baixo consumo de peixes).</li></ul>`]]},
{id:"clinica",g:"Nutrição na gestação",t:"Cardápio e intercorrências",
s:"A avaliação clínica precede a dieta. O plano tem 6 refeições em intervalos de 2 a 3 horas e adapta-se aos sintomas de cada fase.",
p:"Lácteos 3 porções/dia; feijão ≥4×/semana; peixes 2–3×/semana. Náuseas: 1º tri. Constipação: a partir da 20ª semana.",
sec:[
["Arquitetura do cardápio",`<ul><li>3 porções de lácteos/dia para 1.000 mg de cálcio.</li><li>Carnes vermelhas ou brancas (ferro heme); peixes 2–3×/semana; atenção a gestantes vegetarianas.</li><li>Feijão ≥4×/semana, hortaliças e frutas diariamente.</li><li>Controlar bebidas açucaradas (inclusive sucos naturais), ultraprocessados, embutidos e carnes processadas.</li></ul>`],
["Náuseas e vômitos (1º trimestre)",`<ul><li><b>Fazer:</b> até 8 refeições/dia, refeições em temperatura ambiente, picolé de frutas cítricas, gengibre, biscoito salgado ao levantar, vitamina B6.</li><li><b>Evitar:</b> alimentos gordurosos e temperos de odor forte.</li></ul>`],
["Picamalácia",`<p>Ingestão persistente e compulsiva de substâncias não nutritivas. Causa multifatorial: emocional (ansiedade, estresse), nutricional (deficiência de ferro ou zinco) e ambiental (cultura, condição socioeconômica). Investigue anemia.</p>`],
["Pirose (azia)",`<ul><li>Aumentar o número de refeições e reduzir o volume.</li><li>Mastigar bem; não ingerir líquidos junto às refeições.</li><li>Evitar grandes volumes imediatamente antes de deitar.</li></ul>`],

function buildSide(cur,filter){

    if(l.length)h+=`<h3>${g}</h3>`+l.map(t=>`<a href="#/${t.id}" class="${cur==t.id?"on":""} ${done.includes(t.id)?"ok":""}">${t.t}</a>`).join("");

let qz={order:shuffle(Q.map((_,i)=>i)),i:0,score:0,ans:null};
function quiz(){
  if(qz.i>=qz.order.length){
    return `<h1>Resultado</h1><div class=stats><div><b>${qz.score}/${Q.length}</b>acertos</div><div><b>${Math.round(qz.score/Q.length*100)}%</b>aproveitamento</div></div><p>As questões erradas foram salvas na aba Revisão.</p><div class=row><button class="btn pri" data-a=qrestart>Refazer quiz</button><a class=btn href="#/revisao">Ver revisão</a></div>`;
  }
  const n=qz.order[qz.i],q=Q[n];
  return `<h1>Quiz</h1><p>Questão ${qz.i+1} de ${Q.length}</p><h2 style="font-size:1.2rem">${q[0]}</h2><div role=group>${q[1].map((o,k)=>{
    let c="";if(qz.ans!==null){if(k==q[2])c="ok";else if(k==qz.ans)c="no"}
    return `<button class="op ${c}" data-a=opt data-k=${k} ${qz.ans!==null?"disabled":""}>${o}</button>`}).join("")}</div>
  ${qz.ans!==null?`<div class=ex><b>${qz.ans==q[2]?"Correto.":"Incorreto."}</b> ${q[3]}</div><button class="btn pri" data-a=qnext>${qz.i+1<Q.length?"Próxima questão":"Ver resultado"}</button>`:""}`;
}
/* Revisão */
function review(){
  const c=rev.map(i=>`<div class=rv><b>${F[i][0]}</b><p>${F[i][1]}</p><button class=btn data-a=rm data-id=${i}>Remover</button></div>`).join("");
  const w=wrong.map(n=>`<div class=rv><b>${Q[n][0]}</b><p>Resposta: ${Q[n][1][Q[n][2]]}. ${Q[n][3]}</p><button class=btn data-a=rmq data-id=${n}>Remover</button></div>`).join("");
  return `<h1>Revisão</h1><p>Cartões marcados e questões erradas ficam aqui (salvos neste aparelho).</p>
  <h2>Flashcards para revisar (${rev.length})</h2>${c||"<p>Nada por aqui ainda.</p>"}${rev.length?`<button class="btn pri" data-a=revgo>Estudar estes cartões</button>`:""}
  <h2 style="margin-top:24px">Questões erradas (${wrong.length})</h2>${w||"<p>Nenhuma questão errada.</p>"}`;
}
function results(q){
  const k=norm(q),r=T.filter(t=>norm(t.txt).includes(k));
  buildSide("",r.map(t=>t.id));
  const hl=s=>{const i=norm(s).indexOf(k);return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+q.length)+"</mark>"+s.slice(i+q.length)};
  main.innerHTML=`<h1>Busca</h1><p>${r.length} resultado(s) para “${q.replace(/</g,"&lt;")}”.</p><div class=grid>`+r.map(t=>{
    const i=norm(t.txt).indexOf(k),sn=t.txt.slice(Math.max(0,i-50),i+90);
    return `<a class=tc href="#/${t.id}"><b>${t.t}</b><span>…${hl(sn)}…</span></a>`}).join("")+`</div>`+(r.length?"":"<p>Tente outra palavra, como “ferro”, “pega” ou “insulina”.</p>");
}

/* ===================== Roteador ===================== */
function route(){
  $("#q").value="";document.body.classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");
  const id=location.hash.replace(/^#\//,"")||"inicio",t=T.find(x=>x.id==id);
  let h,title="Materno-Infantil | Plataforma de Estudos";
  if(t){h=topic(t);title=t.t+" | Materno-Infantil"}
  else if(id=="flashcards"){h=flash();title="Flashcards | Materno-Infantil"}
  else if(id=="quiz")h=quiz();
  else if(id=="revisao")h=review();
  else h=home();
  main.innerHTML=h;document.title=title;buildSide(t?t.id:id);scrollTo(0,0);
}
function redraw(){const y=scrollY;route_keep();scrollTo(0,y)}
function route_keep(){ // re-renderiza a view atual sem limpar a busca
  const id=location.hash.replace(/^#\//,"")||"inicio",t=T.find(x=>x.id==id);
  main.innerHTML=t?topic(t):id=="flashcards"?flash():id=="quiz"?quiz():id=="revisao"?review():home();
  buildSide(t?t.id:id);
}
addEventListener("hashchange",route);

/* ===================== Eventos ===================== */
main.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
  const ids=()=>fl.only?fl.order.filter(i=>rev.includes(i)):fl.order;
  if(a=="all"||a=="none")main.querySelectorAll("details").forEach(d=>d.open=a=="all");
  else if(a=="done"){const k=b.dataset.id;done=done.includes(k)?done.filter(x=>x!=k):done.concat(k);sv("mi_done",done);redraw();}
  else if(a=="flip"){fl.flip=!fl.flip;redraw()}
  else if(a=="fnext"){fl.i=(fl.i+1)%ids().length;fl.flip=false;redraw()}
  else if(a=="fprev"){fl.i=(fl.i-1+ids().length)%ids().length;fl.flip=false;redraw()}
  else if(a=="shuf"){fl.order=shuffle(fl.order);fl.i=0;fl.flip=false;redraw()}
  else if(a=="know"){rev=rev.filter(x=>x!=id);sv("mi_rev",rev);fl.flip=false;if(fl.only&&fl.i>=ids().length)fl.i=0;else if(!fl.only)fl.i=(fl.i+1)%ids().length;redraw()}
  else if(a=="later"){if(!rev.includes(id)){rev.push(id);sv("mi_rev",rev)}redraw()}
  else if(a=="opt"){const k=+b.dataset.k,n=qz.order[qz.i];qz.ans=k;if(k==Q[n][2])qz.score++;else if(!wrong.includes(n)){wrong.push(n);sv("mi_wrong",wrong)}redraw()}
  else if(a=="qnext"){qz.i++;qz.ans=null;redraw();scrollTo(0,0)}
  else if(a=="qrestart"){qz={order:shuffle(Q.map((_,i)=>i)),i:0,score:0,ans:null};redraw()}
  else if(a=="rm"){rev=rev.filter(x=>x!=id);sv("mi_rev",rev);redraw()}
  else if(a=="rmq"){wrong=wrong.filter(x=>x!=id);sv("mi_wrong",wrong);redraw()}
  else if(a=="revgo"){fl.only=true;fl.i=0;fl.flip=false;location.hash="#/flashcards"}
});
main.addEventListener("change",e=>{if(e.target.dataset.a=="only"){fl.only=e.target.checked;fl.i=0;fl.flip=false;redraw()}});
main.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.dataset.a=="flip"){e.preventDefault();fl.flip=!fl.flip;redraw()}});
$("#q").addEventListener("input",e=>{const v=e.target.value.trim();if(v.length<2){route_keep();return}results(v)});
$("#q").addEventListener("keydown",e=>{if(e.key=="Escape"){e.target.value="";route_keep()}});
$("#menuBtn").addEventListener("click",()=>{const o=document.body.classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)});
$("#ov").addEventListener("click",()=>{document.body.classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false")});
addEventListener("keydown",e=>{if(e.key=="Escape"&&document.body.classList.contains("open")){document.body.classList.remove("open");$("#menuBtn").focus()}});
$("#side").addEventListener("click",e=>{if(e.target.closest("a"))document.body.classList.remove("open")});
const topBtn=$("#top");
addEventListener("scroll",()=>{topBtn.style.display=scrollY>500?"block":"none"},{passive:true});
topBtn.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
route();
</script>
</body>
</html>
